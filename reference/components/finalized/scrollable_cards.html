        --text-card-promo: clamp(24px, 2.9vw, 48px);
        --text-card-kicker: clamp(12px, 1.33vw, 22px);
        --text-card-title: clamp(16px, 1.69vw, 28px);
        --text-card-disclaimer: clamp(14px, 1.21vw, 20px);
    }

    #scrollable_cards_1--gtm .scrollable-card-wrapper {
        --card-gap: clamp(16px, 1.45vw, 24px);
        --card-count: 4;
        --card-min-width: 250px;
        --card-title-gap: 16px;
        --prev-btn-hover-img: url('https://images.contentstack.io/v3/assets/blt964243cdd7810dea/blt85d13c756fd4c87f/6668cc8105319148701f3beb/left-arrow_hover.svg');
        --next-btn-hover-img: url('https://images.contentstack.io/v3/assets/blt964243cdd7810dea/bltc1bb7050ac69c4dc/6668c1d8a70874062b612002/arrow_hover.svg');
        position: relative;
    }

    #scrollable_cards_1--gtm .scrollable-container {
        display: flex;
        align-items: flex-start;
        flex-wrap: nowrap;
        gap: var(--card-gap);
        overflow-x: auto;
        overflow-y: hidden;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
    }

    #scrollable_cards_1--gtm .scrollable-container::-webkit-scrollbar {
        display: none;
    }

    #scrollable_cards_1--gtm .scrollable-card {
        box-sizing: border-box;
        flex: 0 0 calc((100% - (var(--card-gap) * (var(--card-count) - 1))) / var(--card-count));
        min-width: var(--card-min-width);
        max-width: calc((1656px - (var(--card-gap) * (var(--card-count) - 1))) / var(--card-count));
        overflow: hidden;
        position: relative;
        text-decoration: none;
    }

    #scrollable_cards_1--gtm .card_media,
    #scrollable_cards_1--gtm picture {
        border-radius: 0.5rem;
        display: block;
        overflow: hidden;
        width: 100%;
    }

    #scrollable_cards_1--gtm .card_media img,
    #scrollable_cards_1--gtm .scrollable-card-count-based-width {
        display: block;
        height: auto;
        max-width: 100% !important;
        min-width: 0 !important;
        object-fit: cover;
        width: 100% !important;
    }

    #scrollable_cards_1--gtm .text-overlay {
        pointer-events: none;
    }

    #scrollable_cards_1--gtm .css-scroll-btn {
        top: 45%;
        z-index: 2;
    }

    @media (max-width: 767px) {
        #scrollable_cards_1--gtm {
            --text-card-promo: clamp(18px, 7.2vw, 27px);
            --text-card-kicker: clamp(10px, 3.2vw, 12px);
            --text-card-title: clamp(14px, 4.26vw, 16px);
            --text-card-disclaimer: clamp(10px, 3.2vw, 12px);
        }

        #scrollable_cards_1--gtm .scrollable-card-wrapper {
            --card-gap: 16px;
            --card-min-width: 250px;
        }

        #scrollable_cards_1--gtm .card_media,
        #scrollable_cards_1--gtm picture {
            border-radius: 0.25rem;
        }

        #scrollable_cards_1--gtm .scrollable-container {
            padding-right: 16px;
        }

        #scrollable_cards_1--gtm .css-scroll-btn {
            display: none !important;
        }
    }
</style>

<script>
    (function () {
        var root = document.getElementById("scrollable_cards_1--gtm");
        if (!root) return;

        function initScrollControls() {
            var container = root.querySelector(".scrollable-container");
            var prevButton = root.querySelector(".css-scroll-btn-prev");
            var nextButton = root.querySelector(".css-scroll-btn-next");
            if (!container || !prevButton || !nextButton) return;

            function isDesktop() {
                return window.innerWidth > 767;
            }

            function getCardCount() {
                var wrapper = root.querySelector(".scrollable-card-wrapper");
                var raw = wrapper ? getComputedStyle(wrapper).getPropertyValue("--card-count").trim() : "";
                var parsed = parseInt(raw, 10);
                return Number.isFinite(parsed) && parsed > 0 ? parsed : 4;
            }

            function calculateScrollAmount() {
                var firstCard = container.querySelector(".scrollable-card");
                if (!firstCard) return container.clientWidth;

                var styles = getComputedStyle(container);
                var gap = parseFloat(styles.columnGap || styles.gap) || 16;
                var cardWidth = firstCard.offsetWidth + gap;
                var visibleCards = isDesktop() ? getCardCount() : 1;

                return cardWidth * visibleCards;
            }

            function updateButtonVisibility() {
                var maxScrollLeft = container.scrollWidth - container.clientWidth;

                if (isDesktop() && maxScrollLeft > 1) {
                    prevButton.style.display = container.scrollLeft > 1 ? "block" : "none";
                    nextButton.style.display = container.scrollLeft < maxScrollLeft - 1 ? "block" : "none";
                } else {
                    prevButton.style.display = "none";
                    nextButton.style.display = "none";
                }
            }

            nextButton.addEventListener("click", function () {
                container.scrollBy({ left: calculateScrollAmount(), behavior: "smooth" });
            });

            prevButton.addEventListener("click", function () {
                container.scrollBy({ left: -calculateScrollAmount(), behavior: "smooth" });
            });

            container.addEventListener("scroll", updateButtonVisibility);
            window.addEventListener("resize", updateButtonVisibility);

            if ("ResizeObserver" in window) {
                new ResizeObserver(updateButtonVisibility).observe(container);
            }

            updateButtonVisibility();
        }

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", initScrollControls);
        } else {
            initScrollControls();
        }
    })();
</script>
