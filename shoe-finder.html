        if (!root) return;

        const els = {
            sfWrap: root.querySelector(".sf__wrap"),
            progressWrap: root.querySelector(".sf__progressWrap"),
            progress: root.querySelector(".sf__progress"),
            panel: root.querySelector(".sf__panel"),

        // =========================
        //  ALGOLIA CONFIG
        // =========================
        const ALGOLIA = {
            appId: "EKMP1KFS6W",
            apiKey: "22642137a8bd9574c0365f91b1087e92",
            // index: "prodlive-skus-data-inventoryaware",

            productsIndex: "prodlive-products-data",     // second index (products/details)
        };


        // Use fetch directly: the host page's XHR wrappers can break the SDK transport.
        async function queryAlgolia(indexName, params) {
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 15000);
            try {
                const response = await window.fetch(
                    `https://${ALGOLIA.appId.toLowerCase()}-dsn.algolia.net/1/indexes/${encodeURIComponent(indexName)}/query`,
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "X-Algolia-Application-Id": ALGOLIA.appId,
                            "X-Algolia-API-Key": ALGOLIA.apiKey,
                        },
                        body: JSON.stringify({ query: "", ...params }),
                        signal: controller.signal,
                    }
                );
                if (!response.ok) {
                    throw new Error(`Algolia search failed (HTTP ${response.status})`);
                }
                const result = await response.json();
                if (!Array.isArray(result?.hits) || !Number.isFinite(result.nbHits)) {
                    throw new Error("Algolia returned an invalid search response");
                }
                return result;
            } finally {
                clearTimeout(timeout);
            }
        }

        function getCookie(name) {
            const pattern = new RegExp(
                "(?:^|; )" + encodeURIComponent(name) + "=([^;]*)"
            );
            const m = pattern.exec(document.cookie || "");
            return m ? decodeURIComponent(m[1]) : "";
        }

        function extractNumericIds(str) {
            if (!str) return [];
            const matches = String(str).match(/\d+/g) || [];
            return matches.filter((v) => /^\d+$/.test(v));
        }

        function normalizeToIdArray(input) {
            const ids = new Set();
            if (input == null) return [];

            if (Array.isArray(input)) {
                for (const el of input) normalizeToIdArray(el).forEach((x) => ids.add(x));
                return Array.from(ids);
            }

            if (typeof input === "object") {
                if ("storeIds" in input && input.storeIds != null)
                    normalizeToIdArray(input.storeIds).forEach((x) => ids.add(x));
                if ("storeId" in input && input.storeId != null)
                    normalizeToIdArray(input.storeId).forEach((x) => ids.add(x));
                return Array.from(ids);
            }

            extractNumericIds(String(input)).forEach((x) => ids.add(x));
            return Array.from(ids);
        }

        function getInventoryFilterV2() {

            let myStoreIds = [];
            try {
                const sel = localStorage.getItem("aso_WC_StLocId_Selected");
                if (sel) myStoreIds = normalizeToIdArray(JSON.parse(sel));
            } catch (e) { }

            const sddIds = normalizeToIdArray(getCookie("sddStoreId"));
            const nearbyIds = normalizeToIdArray(getCookie("nbmsids"));

            const pickSet = new Set();
            const stsSet = new Set();

            myStoreIds.forEach((id) => {
                pickSet.add(id);
                stsSet.add(id);
            });
            nearbyIds.forEach((id) => {
                pickSet.add(id);
                stsSet.add(id);
            });
            sddIds.forEach((id) => {
                pickSet.add(id);
            });

            if (pickSet.size === 0 && stsSet.size === 0) {
                return "sth_oos:0";
            }

            const pickOrs = Array.from(pickSet).map((id) => `inventory_pick:${id}`);
            const stsOrs = Array.from(stsSet).map((id) => `inventory_sts:${id}`);

            const clauses = [
                "sth_oos:0",
                "lsi_oos:0",
                "stsfs_oos:0",
                ...pickOrs,
                ...stsOrs,
            ];

            return `(${clauses.join(" OR ")})`;
        }

        // =========================
        //  FILTER MAPS
        // =========================
        // Surface grouped keys: Road / Trail / Gym. "Training" included under Gym.
        // One facet value can belong to multiple groups.
        const filterMap = {
            gender: {
                "": [],
                Men: [
                    { a: "facet_Gender", v: "Men's" },
                    { a: "facet_Gender", v: "Unisex" },
                    { a: "facet_Gender", v: "Men's , Women's" },
                    { a: "facet_Gender", v: "Adults'" },
                ],
                Women: [
                    { a: "facet_Gender", v: "Women's" },
                    { a: "facet_Gender", v: "Unisex" },
                    { a: "facet_Gender", v: "Men's , Women's" },
                ],
            },

            cushioning: {
                "": [],
                // Negated so shoes with no cushioning value still count as Regular.
                regular: [
                    { a: "facet_Cushioning", v: "Extra", neg: true },
                    { a: "facet_Cushioning", v: "Maximum", neg: true },
                    { a: "facet_Cushioning", v: "Low", neg: true },
                ],
                extra: [{ a: "facet_Cushioning", v: "Extra" }],
                maximum: [{ a: "facet_Cushioning", v: "Maximum" }],
                any: [],
            },


            pronation: {
                "": [],
                normal: [
                    { a: "facet_Pronation", v: "Normal Pronation" },
                    { a: "facet_Pronation", v: "Neutral" },
                    { a: "facet_Pronation", v: "Mid" },
                ],
                over: [{ a: "facet_Pronation", v: "Overpronation" }],
                under: [{ a: "facet_Pronation", v: "Underpronation" }],
            },

            stability: {
                "": [],
                neutral: [{ a: "facet_Stability", v: "Neutral" }],
                support: [{ a: "facet_Stability", v: "Support" }],
                "max-support": [{ a: "facet_Stability", v: "Max-Support" }],
            },


            surface: {
                "": [],
                any: [],
                road: [
                    { a: "facet_Surface Type", v: "Court" },
                    { a: "facet_Surface Type", v: "Road" },
                    { a: "facet_Surface Type", v: "Street" },
                    { a: "facet_Surface Type", v: "Track" },
                    { a: "facet_Surface Type", v: "Road and Trail" },
                    { a: "facet_Surface Type", v: "Road, Trail" },
                    { a: "facet_Surface Type", v: "Multi-surface" },
                    { a: "facet_Surface Type", v: "Multiple" },
                    { a: "facet_Surface Type", v: "Various surfaces" },
                    { a: "facet_Surface Type", v: "All-surface" },
                    { a: "facet_Surface Type", v: "Most surfaces" },
                    { a: "facet_Surface Type", v: "Training" },
                    { a: "facet_Surface Type", v: "Indoor/Outdoor" },
                    { a: "facet_Surface Type", v: "Multi" },
                    { a: "facet_Surface Type", v: "Hard, paved" },
                    { a: "facet_Surface Type", v: "Road/Track" },
                    { a: "facet_Surface Type", v: "Road, Trail, Indoors" },
                    { a: "facet_Surface Type", v: "On- and Off-Road" },
                ],

                trail: [
                    { a: "facet_Surface Type", v: "Trail" },
                    { a: "facet_Surface Type", v: "Road and Trail" },
                    { a: "facet_Surface Type", v: "Road, Trail" },
                    { a: "facet_Surface Type", v: "Trail / All-terrain" },
                    { a: "facet_Surface Type", v: "All-Terrain" },
                    { a: "facet_Surface Type", v: "Trail, Outdoor" },
                    { a: "facet_Surface Type", v: "Off-road, All-terrain, Trail" },
                    { a: "facet_Surface Type", v: "Rough surfaces" },
                    { a: "facet_Surface Type", v: "Off-road, Wet and Dry" },
                    { a: "facet_Surface Type", v: "Tough terrain" },
                    { a: "facet_Surface Type", v: "Multi-surface" },
                    { a: "facet_Surface Type", v: "Multiple" },
                    { a: "facet_Surface Type", v: "Various surfaces" },
                    { a: "facet_Surface Type", v: "All-surface" },
                    { a: "facet_Surface Type", v: "Most surfaces" },
                    { a: "facet_Surface Type", v: "Multi" },
                    { a: "facet_Surface Type", v: "Road, Trail, Indoors" },
                    { a: "facet_Surface Type", v: "On- and Off-Road" },
                    { a: "facet_Surface Type", v: "Firm Ground" },
                ],

                gym: [
                    { a: "facet_Surface Type", v: "Court" },
                    { a: "facet_Surface Type", v: "Road" },
                    { a: "facet_Surface Type", v: "Street" },
                    { a: "facet_Surface Type", v: "Track" },
                    { a: "facet_Surface Type", v: "Indoor/Outdoor" },
                    { a: "facet_Surface Type", v: "Multi-surface" },
                    { a: "facet_Surface Type", v: "Multiple" },
                    { a: "facet_Surface Type", v: "Various surfaces" },
                    { a: "facet_Surface Type", v: "All-surface" },
                    { a: "facet_Surface Type", v: "Most surfaces" },
                    // add "Training" to Gym bucket per request:
                    { a: "facet_Surface Type", v: "Training" },
                    { a: "facet_Surface Type", v: "Multi" },
                    { a: "facet_Surface Type", v: "Hard, paved" },
                    { a: "facet_Surface Type", v: "Road/Track" },
                    { a: "facet_Surface Type", v: "Road, Trail, Indoors" },
                    { a: "facet_Surface Type", v: "Gym, Track" },
                ],
            },
        };


        // =========================
        //  FILTER BUILDER
        // =========================
        function buildAlgoliaFiltersStringFromState(state) {
            const a = state?.answers || {};
            const parts = [];

            // helper: escape value for Algolia filters string
            // - if value has quotes, escape them
            // - wrap in double quotes if it contains spaces or commas or special chars
            function qVal(v) {
                const s = String(v ?? "");
                const escaped = s.replace(/\\/g, "\\\\").replace(/"/g, '\\"');
                return /[\s,:()]/.test(s) ? `"${escaped}"` : `"${escaped}"`; // safe to always quote
            }

            // helper: build OR group from defs [{a,v,neg?}]
            function addGroupFromMap(group, key) {
                const defs = filterMap[group]?.[key];
                if (!defs || !defs.length) return;

                // Helper to format the clause with quotes around the attribute name
                const formatClause = (d) => `"${d.a}":${qVal(d.v)}`;

                // if any neg, we must AND them (like: NOT "A":"V1" AND NOT "A":"V2")
                const hasNeg = defs.some((d) => d.neg);
                if (hasNeg) {
                    const negParts = defs.map((d) => {
                        const clause = formatClause(d);
                        return d.neg ? `NOT ${clause}` : clause;
                    });
                    parts.push(negParts.length > 1 ? `(${negParts.join(" AND ")})` : negParts[0]);
                    return;
                }

                // Normal OR grouping for multiple surface types
                const orParts = defs.map((d) => formatClause(d));
                parts.push(orParts.length > 1 ? `(${orParts.join(" OR ")})` : orParts[0]);
            }

            // ---- gender ---- (skip if audience is any/empty)
            const aud = String(a.audience || "").toLowerCase();
            const personaKey = aud === "men" ? "Men" : aud === "women" ? "Women" : "";
            if (personaKey) addGroupFromMap("gender", personaKey);

            // ---- activity ----
            parts.push(`facet_Activity:${qVal("Running")}`);

            // ---- surface  ----
            const surfaceAnswer = String(a.surface || "").toLowerCase();
            const surfaceKey = surfaceAnswer === "treadmill" ? "gym" : surfaceAnswer;
            if (surfaceKey) addGroupFromMap("surface", surfaceKey);

            // ---- cushioning ----
            const cushionKey = String(a.cushioning || "").toLowerCase();
            if (cushionKey && cushionKey !== "any") addGroupFromMap("cushioning", cushionKey);

            // ---- stability ----
            const stabilityKey = String(a.stability || "").toLowerCase();
            if (stabilityKey) addGroupFromMap("stability", stabilityKey);

            // ---- pronation ----
            const pronationKey = String(a.pronation || "").toLowerCase();
            if (pronationKey) addGroupFromMap("pronation", pronationKey);

            // ---- size (only if men/women; skip if any) ----
            const sizes = Array.isArray(a.size) ? a.size.filter(Boolean) : [];
            if (sizes.length) {
                const sizeAttr =
                    aud === "women" ? "facet_womensShoeSize" :
                        aud === "men" ? "facet_mensShoeSize" :
                            null;

                if (sizeAttr) {
                    const orSizes = sizes.map((sz) => `${sizeAttr}:${qVal(String(sz))}`);
                    parts.push(orSizes.length > 1 ? `(${orSizes.join(" OR ")})` : orSizes[0]);
                }
            }

            // ---- inventory  ----
            parts.push(getInventoryFilterV2());

            // ---- product type ---- 
            parts.push(`"facet_Product Type":"Shoes"`);

            return parts.join(" AND ");
        }

        function attachEvents() {

            const targets = document.querySelectorAll('a.sfResultCta, a.sfResultMediaClick');

            console.log('targets: ', targets);

            targets.forEach((element) => {
                if (element.dataset.hasClickEvent === "true") return;

                element.addEventListener('click', (e) => {
                    e.preventDefault();

                    const parent_sku = e.currentTarget.getAttribute('data-parentsku');
                    const child_sku = e.currentTarget.getAttribute('data-childsku');

                    if (typeof window.launchASOQuickView === 'function') {
                        window.launchASOQuickView({
                            item: {
                                other_client_item_ids: {
                                    identifiers: {
                                        parent_sku: parent_sku,
                                        sku: child_sku,
                                        skus: [child_sku]
                                    },
                                },
                                sku: child_sku,
                                skus: [child_sku]
                            },
                        });
                    } else {
                        console.error("launchASOQuickView is not defined");
                    }
                });

                // Mark as bound
                element.dataset.hasClickEvent = "true";
            });
        }

        function normalizeScene7Url(u) {
            const s = String(u || "").trim();
            if (!s) return "";
            if (s.startsWith("//")) return "https:" + s;     // //academy... -> https://academy...
            if (s.startsWith("http")) return s;
            return s;
        }

        function extractImageUrl(detail) {
            // Prefer detail.XFULLIMAGE if present
            const raw =
                detail?.XFULLIMAGE ||
                detail?.xFullImage ||
                detail?.xfullimage ||
                "";
            return normalizeScene7Url(raw);
        }

        function getHitRatingNumber(hit) {
            const r = parseFloat(
                hit?.averageRating ??
                0
            );

            return Number.isFinite(r) ? r : 0;
        }


        function getHitStartDateMs(hit) {
            const t = new Date(hit?.startDate).getTime();
            return Number.isFinite(t) ? t : 0;
        }

        function sortHitsByStartDateDesc(hits) {
            (hits || []).sort((a, b) => getHitStartDateMs(b) - getHitStartDateMs(a));
            return hits;
        }




        function uniq(arr) {
            return Array.from(new Set((arr || []).filter(Boolean)));
        }

        function hasWideAvailable(hit) {
            const widths = hit?.facet_footwearWidth;

            if (!Array.isArray(widths)) return false;

            return widths.some((w) =>
                typeof w === "string" && w.toLowerCase().includes("wide")
            );
        }



        function extractParentPartNumber(hit) {
            // adjust if the field name differs
            return (
                hit?.parentPartNumber ||
                ""
            );
        }

        function stripHtml(html) {
            const s = String(html || "");
            return s.replace(/<[^>]*>/g, " ").replace(/\s+/g, " ").trim();
        }

        // function truncate(str, n) {
        //     const s = String(str || "");

        //     return s.slice(0, n).trim() + "…";

        function extractFeatureBenefitsValues(fb) {
            if (!fb || typeof fb !== "object") return [];
            // keep the natural order featureBenefit1..N if present
            const keys = Object.keys(fb).sort((a, b) => {
                const na = parseInt(a.match(/\d+/)?.[0] || "0", 10);
                const nb = parseInt(b.match(/\d+/)?.[0] || "0", 10);
                return na - nb;
            });
            return keys.map((k) => fb[k]).filter((v) => typeof v === "string" && v.trim());
        }

        function extractChildSkuIdFromDetail(detail) {
            return detail?.defaultSku?.skuId || "";
        }


        function extractAverageRating(detail) {
            const r = detail?.averageRating ?? detail?.avgRating ?? detail?.rating;
            const num = parseFloat(r);
            return Number.isFinite(num) ? num : 0;
        }

        function renderStars(rating) {
            const raw = Math.max(0, Math.min(5, Number(rating) || 0));

            // Bucket to X.5 within each [X, X+1) range; 0 stays 0 unless > 0.
            let normalized;
            if (raw >= 5) normalized = 5;
            else if (raw > 0) normalized = Math.floor(raw) + 0.5;
            else normalized = 0;

            const full = Math.floor(normalized);
            const hasHalf = normalized % 1 !== 0;

            let stars = "";
            for (let i = 0; i < 5; i++) {
                if (i < full) {
                    stars += `<span class="sfStar sfStar--full"></span>`;
                } else if (i === full && hasHalf) {
                    stars += `<span class="sfStar sfStar--half"></span>`;
                } else {
                    stars += `<span class="sfStar"></span>`;
                }
            }

            return `
    <div class="sfStarsWrap">
      <div class="sfStars">${stars}</div>
      <div class="sfStarsValue">${raw.toFixed(1)}</div>
    </div>
  `;
        }

        function chunkArray(arr, size) {
            const out = [];
            for (let i = 0; i < arr.length; i += size) out.push(arr.slice(i, i + size));
            return out;
        }

        function pickLongDescription(product) {
            return (
                product?.longDescription ||
                product?.long_description ||
                product?.description ||
                product?.longDescriptionText ||
                ""
            );
        }

        function escapeAlgoliaFilterValue(v) {
            return String(v).replace(/\\/g, "\\\\").replace(/"/g, '\\"');
        }

        async function enrichHitsWithLongDescriptionAndBenefits(hits) {

            if (!Array.isArray(hits) || hits.length === 0) return hits;

            const ids = Array.from(
                new Set(
                    hits
                        .map((h) => h?.parentPartNumber)
                        .filter((id) => typeof id === "string" && id.length > 0)
                )
            );
            if (!ids.length) return hits;

            // Keep filter strings from getting too large
            const CHUNK_SIZE = 50;
            const chunks = chunkArray(ids, CHUNK_SIZE);

            const idToDetails = new Map(); // objectID -> { longDescription, featureBenefits }

            await Promise.all(
                chunks.map(async (chunkIds) => {
                    const orFilter = chunkIds
                        .map((id) => `partNumber:"${escapeAlgoliaFilterValue(id)}"`)
                        .join(" OR ");

                    const res = await queryAlgolia(ALGOLIA.productsIndex, {
                        filters: orFilter,
                        hitsPerPage: chunkIds.length,
                        page: 0,
                    });


                    (res?.hits || []).forEach((p) => {

                        if (!p?.partNumber) return;

                        idToDetails.set(p.partNumber, {
                            longDescription: p.longDescription,
                            featureBenefits: p.featureBenefits,
                        });
                    });
                })
            );

            // Merge back onto original hits
            hits.forEach((hit) => {
                const id = hit?.parentPartNumber;
                const details = idToDetails.get(id);

                if (details) {
                    // longDescription
                    if (typeof details.longDescription === "string" && details.longDescription.trim()) {
                        hit.longDescription = details.longDescription;
                    } else if (!hit.longDescription) {
                        hit.longDescription = "";
                    }

                    // featureBenefits (object expected)
                    if (details.featureBenefits && typeof details.featureBenefits === "object") {
                        hit.featureBenefits = details.featureBenefits;
                    } else if (!hit.featureBenefits) {
                        hit.featureBenefits = null; // so extractFeatureBenefitsValues returns []
                    }
                } else {
                    // If no details record found, keep things predictable
                    if (!hit.longDescription) hit.longDescription = "";
                    if (!hit.featureBenefits) hit.featureBenefits = null;
                }
            });

            return hits;
        }

        async function searchWithFallbacks({ baseState, minHits = 5, hitsPerPage = 24 }) {
            // We only mutate this local copy
            const answers = typeof structuredClone === "function"
                ? structuredClone(baseState.answers)
                : JSON.parse(JSON.stringify(baseState.answers));

            const relaxOrder = ["pronation", "stability", "cushioning", "surface"];

            let lastRes = null;
            const removed = [];

            for (let attempt = 0; attempt <= relaxOrder.length; attempt++) {
                const filters = buildAlgoliaFiltersStringFromState({ answers });

                const res = await queryAlgolia(ALGOLIA.index, {
                    filters,
                    page: 0,
                    hitsPerPage,
                });

                lastRes = res;

                const hitCount = (res?.hits || []).length;
                if (hitCount >= minHits) break;

                // if we still need to relax, remove next key and try again
                if (attempt < relaxOrder.length) {
                    const key = relaxOrder[attempt];
                    if (answers[key] != null && answers[key] !== "" && answers[key] !== "any") {
                        removed.push(key);
                    }
                    answers[key] = null;
                }
            }

            return { res: lastRes, removed };
        }

        async function runAlgoliaSearch(state) {
            try {
                const { res, removed } = await searchWithFallbacks({
                    baseState: state,
                    minHits: 5,
                });
                const hits = res.hits;

                // Product details are optional; keep matches if enrichment fails.
                try {
                    await enrichHitsWithLongDescriptionAndBenefits(hits);
                } catch (err) {
                    console.warn("[ShoeFinder] Product enrichment failed:", err);
                }

                return { ...res, hits, meta: { removedFilters: removed } };
            } catch (err) {
                console.error("[ShoeFinder] Algolia search error:", err);
                return { hits: [], nbHits: 0, nbPages: 0, err };
            }
        }

            state.results.nbHits = res.nbHits;
            state.results.removedFilters = res.meta?.removedFilters || [];

        // session object
        const SF_STORAGE_KEY = "brooksShoeFinder.session.v1";
        // started flag
        const SF_STARTED_KEY = "brooksShoeFinder.started.v1";

        function hasStartedThisTab() {
            try { return sessionStorage.getItem(SF_STARTED_KEY) === "1"; }
            catch (e) { return false; }
        }

        function markStartedThisTab() {

        function safeParse(json, fallback) {
            try {
                return JSON.parse(json);
            } catch (e) {
                return fallback;
            }
        }

        function clampStepIndex(idx) {
            const n = Number(idx);
            if (!Number.isFinite(n)) return 0;
            return Math.max(0, Math.min(n, STEPS.length - 1));
        }

        function makePersistPayload() {
            return {
                v: 1,
                t: Date.now(),
                stepIndex: state.stepIndex,
                answers: state.answers,
                // Don't store hits (too big). Store a marker so we know we should refetch.
                resultsMeta: {
                    wasOnResults: STEPS[state.stepIndex]?.id === "results",
                    nbHits: state.results?.nbHits || 0,
                },
            };
        }

        function saveToSession() {
            try {
                sessionStorage.setItem(SF_STORAGE_KEY, JSON.stringify(makePersistPayload()));
            } catch (e) {

            }
        }

        function clearSession() {
            try {
                sessionStorage.removeItem(SF_STORAGE_KEY);
            } catch (e) { }

        function restoreFromSession() {
            // If not started, show intro
            if (!hasStartedThisTab()) {
                state.stepIndex = STEPS.findIndex((s) => s.id === "intro");
                return { restored: false, shouldRefetchResults: false };
            }

            const raw = sessionStorage.getItem(SF_STORAGE_KEY);
            if (!raw) return { restored: false, shouldRefetchResults: false };

            const data = safeParse(raw, null);
            if (!data || typeof data !== "object") return { restored: false, shouldRefetchResults: false };

            state.stepIndex = clampStepIndex(data.stepIndex);

            // never restore intro once started
            if (STEPS[state.stepIndex]?.id === "intro") {
                state.stepIndex = STEPS.findIndex((s) => s.id === "surface");
            }

            // Restore answers (merge to keep any new keys that  are added later)
            const restoredAnswers = data.answers && typeof data.answers === "object" ? data.answers : {};
            state.answers = {
                surface: null,
                cushioning: null,
                pronation: null,
                stability: null,
                audience: "men",
                size: [],
                ...restoredAnswers,
            };

            // Restore results meta only (hits will be re-fetched if needed)
            state.results = state.results || { loading: false, error: false, hits: [], nbHits: 0, visibleCount: 5 };

                if (!bubbles.length) return;

                const lastDoneIndex = Math.min(state.stepIndex - 1, bubbles.length - 1);

                if (lastDoneIndex >= 1) {
                    const first = bubbles[0].getBoundingClientRect();
                    const last = bubbles[lastDoneIndex].getBoundingClientRect();

                    const firstCenterX = (first.left + first.right) / 2 - wrapRect.left;
                    const lastCenterX = (last.left + last.right) / 2 - wrapRect.left;

                    els.doneLine.style.left = firstCenterX + "px";
                    els.doneLine.style.width = Math.max(0, lastCenterX - firstCenterX) + "px";
                    els.doneLine.style.display = "block";

        function waitForTransition(el, timeoutMs = 300) {
            return new Promise((resolve) => {
                let done = false;

                const finish = () => {
                    if (done) return;
                    done = true;
                    el.removeEventListener("transitionend", onEnd);
                    clearTimeout(timer);
                    resolve();
                };

                const onEnd = (e) => {
                    // only resolve for the panel itself (not bubbling from children)
                    if (e.target === el) finish();
                };

                const timer = setTimeout(finish, timeoutMs);
                el.addEventListener("transitionend", onEnd);
            });
        }

        function bindIntro() {
            const btn = els.panel.querySelector("[data-sf-intro-start]");
            if (!btn) return;

            btn.addEventListener("click", () => {
                markStartedThisTab();
                // Go to first question
                state.stepIndex = STEPS.findIndex((s) => s.id === "surface");
                saveToSession();
                renderStep();
                window.scrollTo({ top: 0, behavior: "smooth" });
            });
        }


        function renderButtons(step) {
            const current = state.answers[step.id];
            return `
          <div class="sf__stack">
            ${step.options
                    .map(
                        (opt) => `
              <button type="button"
                class="sf__optionBtn"
                data-sf-value="${escapeAttr(opt.value)}"
                aria-pressed="${current === opt.value ? "true" : "false"}"
              >${escapeHtml(opt.label)}</button>

                    )
                    .join("")}

        `;

        function renderPronation3(step) {

            return `

        const MAX_SIZES = 3;

        function renderAudienceWithSizeBehavior() {
            const aud = state.answers.audience;
            const sizes = Array.isArray(state.answers.size) ? state.answers.size : [];
            const sizeSet = aud === "men" ? MEN_SIZES : aud === "women" ? WOMEN_SIZES : null;

            return `
                <div class="sf__stack" style="gap:18px;">
                <div class="sf__audRow">
                    <button type="button" class="sf__audBtn" data-sf-audience="men"
                    aria-pressed="${aud === "men" ? "true" : "false"}">Men's</button>

                    <button type="button" class="sf__audBtn" data-sf-audience="women"
                    aria-pressed="${aud === "women" ? "true" : "false"}">Women's</button>

                    <button type="button" class="sf__audBtn" data-sf-audience="any"
                    aria-pressed="${aud === "any" ? "true" : "false"}">No Preference</button>
                </div>

                ${sizeSet
                    ? `
                    <div>
                        <div class="sf__title mb-2">Select up to ${MAX_SIZES} sizes (optional)</div>
                        <div class="sf__error sf__errorSize mt-1 mb-2" style="display:none" >You can select up to ${MAX_SIZES} sizes.</div>

                        <div class="sf__sizes" role="group" aria-label="Select shoe size (up to ${MAX_SIZES})">
                        ${sizeSet
                        .map((sz) => {
                            const pressed = sizes.includes(sz);
                            return `
                                <button type="button"
                                class="sf__sizeBtn"
                                data-sf-size="${escapeAttr(sz)}"
                                aria-pressed="${pressed ? "true" : "false"}"
                                >${escapeHtml(sz)}</button>
                            `;
                        })
                        .join("")}
                        </div>
                    </div>
                    `
                    : `<div style="height: 120px;"></div>`
                }
                </div>
            `;
        }

        // ============ RESULTS FILTER CHIPS ============
        const FILTER_LABELS = {
            surface: "Surface",
            cushioning: "Cushioning",
            pronation: "Pronation",
            stability: "Stability",
        };

        function getOptionLabel(stepId, value) {
            const opt = STEPS.find((s) => s.id === stepId)?.options?.find((o) => o.value === value);
            return opt ? opt.label.replace(/^My /, "") : String(value);
        }

        function getSelectedFilters() {
            const a = state.answers;
            const relaxed = state.results.removedFilters || [];
            const filters = [];

            Object.keys(FILTER_LABELS).forEach((key) => {
                const v = a[key];
                if (v == null || v === "" || v === "any") return;
                filters.push({
                    key,
                    value: v,
                    label: `${FILTER_LABELS[key]}: ${getOptionLabel(key, v)}`,
                    relaxed: relaxed.includes(key),
                });
            });

            if (a.audience === "men" || a.audience === "women") {
                filters.push({
                    key: "audience",
                    value: a.audience,
                    label: a.audience === "men" ? "Men's" : "Women's",
                    relaxed: false,
                });
            }

            (Array.isArray(a.size) ? a.size : []).forEach((sz) => {
                filters.push({ key: "size", value: sz, label: `Size ${sz}`, relaxed: false });
            });

            return filters;
        }

        function renderFilterChips() {
            const filters = getSelectedFilters();
            if (!filters.length) return "";

            const disabled = state.results.loading ? "disabled" : "";
            return `
            <div class="sfFilters" role="group" aria-label="Your filters">
                <span class="sfFilters__label">Your filters:</span>
                ${filters.map((f) => `
                <button type="button" class="sfFilterChip${f.relaxed ? " sfFilterChip--relaxed" : ""}"
                    data-sf-remove-filter="${escapeAttr(f.key)}"
                    data-sf-filter-value="${escapeAttr(f.value)}"
                    aria-label="Remove filter ${escapeAttr(f.label)}${f.relaxed ? " (not applied)" : ""}"
                    ${disabled}>
                    <span>${escapeHtml(f.label)}${f.relaxed ? ` <em>(not applied)</em>` : ""}</span>
                    <span class="sfFilterChip__x" aria-hidden="true">&times;</span>
                </button>
                `).join("")}
            </div>
            `;
        }

        function renderResultsCount() {
            if (state.results.loading || state.results.error) return "";

            const shown = (state.results.hits || []).length;
            const total = Math.max(state.results.nbHits || 0, shown);
            if (!total) return "";

            const text = total > shown
                ? `${total} shoes match your filters. Showing the top ${shown}.`
                : `${total} ${total === 1 ? "shoe matches" : "shoes match"} your filters.`;

            return `<div class="sfResultsCount" role="status">${escapeHtml(text)}</div>`;
        }

        function removeFilter(key, value) {
            const a = state.answers;
            if (key === "size") {
                a.size = (Array.isArray(a.size) ? a.size : []).filter((sz) => sz !== value);
            } else if (key === "audience") {
                // Sizes are gender-specific, so they go with the audience.
                a.audience = "any";
                a.size = [];
            } else {
                const hasNoPreference = STEPS.find((s) => s.id === key)?.options?.some((o) => o.value === "any");
                a[key] = hasNoPreference ? "any" : null;
            }
            loadResults();
        }

        function bindResultsHeaderButtons() {
            const editBtn = els.panel.querySelector("[data-sf-edit-answers]");
            const startOverBtn = els.panel.querySelector("[data-sf-start-over]");
            const showMoreBtn = els.panel.querySelector("[data-sf-show-more]");
            const retryBtn = els.panel.querySelector("[data-sf-retry]");

            if (retryBtn) {
                retryBtn.addEventListener("click", () => {
                    if (!state.results.loading) loadResults();
                });
            }

            els.panel.querySelectorAll("[data-sf-remove-filter]").forEach((chip) => {
                chip.addEventListener("click", () => {
                    if (state.results.loading) return;
                    removeFilter(
                        chip.getAttribute("data-sf-remove-filter"),
                        chip.getAttribute("data-sf-filter-value")
                    );
                });
            });

            if (editBtn) {
                editBtn.addEventListener("click", () => {
                    resultsRequestId++;
                    state.results.loading = false;
                    state.stepIndex = 5;
                    renderStep();
                    // root.scrollIntoView({ behavior: "smooth", block: "start" });
                });
            }

            if (startOverBtn) {
                startOverBtn.addEventListener("click", () => {
                    resetToFirstQuestion();

                    // root.scrollIntoView({ behavior: "smooth", block: "start" });
                });
            }

            if (showMoreBtn) {
                showMoreBtn.addEventListener("click", () => {
                    const hits = state.results.hits || [];
                    const total = hits.length;
                    const start = state.results.visibleCount || 5;
                    const next = Math.min(start + 5, total);
                    if (next <= start) return;

                    const grid = els.panel.querySelector(".sfResults");
                    if (grid) {
                        const html = hits.slice(start, next).map(renderResultCard).join("");
                        grid.insertAdjacentHTML("beforeend", html);
                        attachEvents();
                    }

                    state.results.visibleCount = next;
                    if (next >= total) {
                        const wrap = els.panel.querySelector(".sfResultsShowMoreWrap");
                        if (wrap) wrap.remove();
                    }
                });
            }
        }

        function renderResultCard(hit) {
            const title = String(hit?.name || "");
            const img = hit.__img || extractImageUrl(hit);
            const wideAvailable = hasWideAvailable(hit);
            const parentSku = String(hit?.parentPartNumber || hit?.objectID || "");
            const childSku = String(hit?.partNumber || "");
            const rating = getHitRatingNumber(hit);
            const longDesc = hit.longDescription;
            const benefits = extractFeatureBenefitsValues(hit.featureBenefits);
            return `
          <article
            class="sfResultCard"
          >
          <a class="sfResultMediaClick" data-parentsku="${escapeAttr(parentSku)}"
            data-childsku="${escapeAttr(childSku)}">
            <div class="sfResultMedia">
                ${img
                    ? `<img class="sfResultImg" src="${escapeAttr(img)}" alt="${escapeAttr(title)}" loading="lazy" />`
                    : `<div class="sfResultImgPlaceholder" aria-hidden="true"></div>`
                }

                ${wideAvailable ? `<div class="sfResultWide">Available in Wide</div>` : ``}
            </div>
          </a>


            <div class="sfResultBody">
              <h4 class="sfResultTitle">${escapeHtml(title)}</h4>

              <div class="sfResultRating">
                ${renderStars(rating)}
              </div>

              <p class="sfResultDesc">${escapeHtml(longDesc)}</p>

              ${benefits.length
                    ? `
                    <div class="sfResultFeatures">
                      <div class="sfResultFeaturesTitle">Features</div>
                      <ul class="sfResultFeaturesList">
                        ${benefits.map((b) => `<li>${escapeHtml(b)}</li>`).join("")}
                      </ul>
                    </div>
                  `
                    : ""
                }

              <a class="sf__btn sf__btn--primary sfResultCta" href="#" aria-label="Shop now"
              data-parentsku="${escapeAttr(parentSku)}"
            data-childsku="${escapeAttr(childSku)}">
                <span class="sf__btnText">SHOP NOW</span>
              </a>
            </div>
          </article>
        `;
        }

        function renderResults() {

            const a = state.answers;
            const loading = state.results.loading;
            const hits = state.results.hits || [];
            const visibleCount = state.results.visibleCount || 5;
            const top5 = hits.slice(0, visibleCount);
            const hasMore = visibleCount < hits.length;

            //     const summary = `
            //   <div class="sf__subtitle" style="max-width:760px;margin:14px auto 0;">
            //     <div><strong>Surface:</strong> ${escapeHtml(a.surface || "-")}</div>
            //     <div><strong>Cushioning:</strong> ${escapeHtml(a.cushioning || "-")}</div>
            //     <div><strong>Pronation:</strong> ${escapeHtml(a.pronation || "-")}</div>
            //     <div><strong>Stability:</strong> ${escapeHtml(a.stability || "-")}</div>
            //     <div><strong>Audience:</strong> ${escapeHtml(a.audience || "any")}</div>
            //     <div><strong>Size:</strong> ${escapeHtml(a.size || "(not selected)")}</div>
            //   </div>
            // `;
            const summary = ``;

            if (loading) {
                return `
            ${summary}
            <div style="max-width:1040px;margin:28px auto 0;padding:0 16px;text-align:center;">
                <img src="https://images.contentstack.io/v3/assets/blt964243cdd7810dea/bltf08be6115854eb7b/699c8de35a4f770008232d73/Loading-ShoeFinder.gif" 
                alt="Loading..." class="sf_loadingGif">
              <div class="sf_loadingText">Looking for the perfect running shoes for you......</div>
            </div>
          `;
            }

            if (state.results.error) {
                return `
            <div role="alert" style="max-width:1040px;margin:28px auto 0;padding:0 16px;text-align:center;">
                <div style="font-weight:700;color:#333;">We couldn't load your shoe matches.</div>
                <p>Please try again. Your answers have been saved.</p>
                <button type="button" class="sf__btn sf__btn--primary" data-sf-retry>
                    <span class="sf__btnText">Try again</span>
                </button>
            </div>
            `;
            }

            if (!top5.length) {
                return `
            ${summary}
            <div style="max-width:1040px;margin:28px auto 0;padding:0 16px;text-align:center;">
                ${Array.isArray(a.size) && a.size.length
                    ? `<div style="font-weight:700;color:#333;">No in-stock running shoes found in your size right now.</div>
                <p>Try another size, or check back soon as new shoes arrive.</p>`
                    : `<div style="font-weight:700;color:#333;">No in-stock running shoes found right now.</div>
                <p>Please check back soon as new shoes arrive.</p>`}
            </div>
            `;
            }

            //     if (!hits.length) {
            //         return `
            //     ${summary}
            //     <div style="max-width:1040px;margin:28px auto 0;padding:0 16px;text-align:center;">
            //       <div style="font-weight:700;color:#333;">No in-stock shoes found for those answers.</div>
            //     </div>
            //   `;
            //     }

            const removed = (state.results.removedFilters || []).map((key) => FILTER_LABELS[key].toLowerCase());
            const relaxedNote = removed.length
                ? `
            <div class="sfResultsRelaxed" role="status" style="max-width:760px;margin:16px auto 0;padding:0 16px;text-align:center;color:#333;">
                Not enough in-stock shoes matched every answer, so these results also include shoes outside your
                ${escapeHtml(removed.length > 1 ? `${removed.slice(0, -1).join(", ")} and ${removed[removed.length - 1]}` : removed[0])}
                ${removed.length > 1 ? "preferences" : "preference"}.
            </div>
            `
                : "";

            return `
  ${summary}
  ${relaxedNote}
  <div class="sfResults">
    ${top5.map(renderResultCard).join("")}
             </div>
            ${hasMore
                ? `
            <div class="sfResultsShowMoreWrap" style="display:flex;justify-content:center;margin-top:24px;">
              <button type="button" class="sf__btn sf__btn--ghost" data-sf-show-more>
                <span class="sf__btnText">Show More</span>
              </button>
            </div>
            `
                : ``}
            `;


        }

        // ========= BINDINGS =========
        function bindButtons(step) {
            const buttons = els.panel.querySelectorAll("[data-sf-value]");
            buttons.forEach((btn) => {
                btn.addEventListener("click", () => {
                    setAnswer(step.id, btn.getAttribute("data-sf-value"));
                    buttons.forEach((b) =>
                        b.setAttribute("aria-pressed", b === btn ? "true" : "false")
                    );
                    goNext();
                });
            });
        }


        function bindAudienceWithSizeBehavior() {
            const audBtns = els.panel.querySelectorAll("[data-sf-audience]");
            audBtns.forEach((btn) => {
                btn.addEventListener("click", () => {
                    const newAud = btn.getAttribute("data-sf-audience");
                    const prevAud = state.answers.audience;

                    setAnswer("audience", newAud);

                    // If switched audience OR selected "any", clear sizes
                    if (newAud === "any" || (prevAud && prevAud !== newAud)) {
                        state.answers.size = [];
                        saveToSession();
                    }

                    renderStep();
                });
            });

            const sizeBtns = els.panel.querySelectorAll("[data-sf-size]");
            sizeBtns.forEach((btn) => {
                btn.addEventListener("click", () => {
                    const v = btn.getAttribute("data-sf-size");

                    // Normalize to array
                    const sizes = Array.isArray(state.answers.size) ? state.answers.size.slice() : [];

                    const idx = sizes.indexOf(v);
                    const isSelected = idx >= 0;

                    if (isSelected) {
                        // Unselect always allowed
                        sizes.splice(idx, 1);
                        state.answers.size = sizes;
                        saveToSession();

                        // Update button states
                        sizeBtns.forEach((b) => {
                            const sv = b.getAttribute("data-sf-size");
                            b.setAttribute("aria-pressed", sizes.includes(sv) ? "true" : "false");
                        });

                        root.querySelector(".sf__errorSize").style.display = "none";
                        return;
                    }

                    // Selecting a new one — enforce max
                    if (sizes.length >= MAX_SIZES) {
                        root.querySelector(".sf__errorSize").style.display = "";
                        return;
                    }

                    sizes.push(v);
                    state.answers.size = sizes;
                    saveToSession();

                    sizeBtns.forEach((b) => {
                        const sv = b.getAttribute("data-sf-size");
                        b.setAttribute("aria-pressed", sizes.includes(sv) ? "true" : "false");
                    });

                    hideError();
                });
            });
        }

        // ========= NAV =========
        async function goNext() {
            const step = STEPS[state.stepIndex];

            // Required checks
            if (step.required && !state.answers[step.id]) {
                showError("Please make a selection to continue.");
                return;
            }

            // After audience step, go to results page and run Algolia
            if (step.id === "audience") {
                state.stepIndex = STEPS.findIndex((s) => s.id === "results");
                await loadResults();
                return;
            }

            // Normal next
            state.stepIndex = Math.min(state.stepIndex + 1, STEPS.length - 1);
            renderStep();
            // root.scrollIntoView({ behavior: "smooth", block: "start" });
        }

        function goBack() {
            hideError();
            state.stepIndex = Math.max(state.stepIndex - 1, 0);
            saveToSession();
            renderStep();
            // root.scrollIntoView({ behavior: "smooth", block: "start" });
        }


        function resetToFirstQuestion() {
            resultsRequestId++;
            markStartedThisTab(); // ensure intro never comes back in this tab

            state.stepIndex = STEPS.findIndex((s) => s.id === "surface");
            state.answers = {
                surface: null,
                cushioning: null,
                pronation: null,
                stability: null,
                audience: "men",
                size: [],
            };
            state.results = { loading: false, error: false, hits: [], nbHits: 0, visibleCount: 5 };

            // IMPORTANT: do NOT clear session; we want intro not to return
            saveToSession();
            renderStep();
        }



        els.btnNext.addEventListener("click", goNext);
        els.btnBack.addEventListener("click", goBack);

        // Reposition line on resize
        let resizeTimer = null;
        window.addEventListener("resize", () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(positionDoneLine, 60);
        });

        // ========= HELPERS =========
        function setAnswer(key, value) {
            state.answers[key] = value;
            hideError();
            saveToSession();
        }


        function showError(msg) {
            els.error.textContent = msg;
            els.error.hidden = false;
        }

        function hideError() {
            els.error.textContent = "";
            els.error.hidden = true;
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, (s) => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;",
            }[s]));
        }

        function escapeAttr(str) {
            return escapeHtml(str).replace(/`/g, "&#096;");
        }


        // Init (restore session + render)
        const restored = restoreFromSession();
        renderStep();

        // If the user refreshed while on results, re-run Algolia to repopulate.
        if (restored.shouldRefetchResults) loadResults();

    })();
</script>
