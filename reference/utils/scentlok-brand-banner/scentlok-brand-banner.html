<script>
    (function scentlokPlpBrandBannerMonetate() {
        const CONFIG = {
            campaign: "scentlok-plp",
            observerKey: "scentlokPlpBrandBannerObserverInstance",
            headingId: "scentlok-plp-heading",
            bannerId: "scentlok-plp-banner",
            shopByCategoryId: "scentlok-plp-shop-by-category",
            insertedAttr: "data-monetate-scentlok-plp",
            headerSelector: ".contentVerticalMargin--iU1wb",
            titleContainerSelector: ".title--uBdU5",
            categoryTileSelector: "[data-auid='subCategoryLinks_PLP']",
            debounceMs: 250
        };

        let isUpdating = false;
        let debounceTimer;
        let headingMarkup = null;
        let bannerMarkup = null;

        function hasCategoryTiles(headerContainer) {
            return Boolean(headerContainer && headerContainer.querySelector(CONFIG.categoryTileSelector));
        }

        function isCampaignNode(node) {
            if (!node || node.nodeType !== 1) return false;
            if (node.id === CONFIG.headingId || node.id === CONFIG.bannerId || node.id === CONFIG.shopByCategoryId) {
                return true;
            }
            return Boolean(node.closest && node.closest(
                "#" + CONFIG.headingId + ", #" + CONFIG.bannerId + ", #" + CONFIG.shopByCategoryId
            ));
        }

        function mutationsNeedCheck(records) {
            for (let i = 0; i < records.length; i += 1) {
                const record = records[i];
                if (!isCampaignNode(record.target)) return true;

                const added = record.addedNodes;
                const removed = record.removedNodes;
                for (let j = 0; j < added.length; j += 1) {
                    if (added[j].nodeType === 1 && !isCampaignNode(added[j])) return true;
                }
                for (let k = 0; k < removed.length; k += 1) {
                    if (removed[k].nodeType === 1 && isCampaignNode(removed[k])) return true;
                }
            }
            return false;
        }

        function rememberMarkup(heading, banner) {
            if (heading && !headingMarkup) headingMarkup = heading.outerHTML;
            if (banner && !bannerMarkup) bannerMarkup = banner.outerHTML;
        }

        function recreateFromMarkup(id, markup) {
            if (!markup) return null;
            const wrapper = document.createElement("div");
            wrapper.innerHTML = markup.trim();
            const element = wrapper.firstElementChild;
            if (element) element.id = id;
            return element;
        }

        function createShopByCategoryElement() {
            const shopByCategory = document.createElement("div");
            shopByCategory.id = CONFIG.shopByCategoryId;
            shopByCategory.setAttribute(CONFIG.insertedAttr, "true");
            shopByCategory.innerHTML =
                '<div class="scentlok-plp-shop-by-category-inner">' +
                    '<div class="hlp-header">' +
                        "<h2>Shop By Category</h2>" +
                    "</div>" +
                "</div>";
            return shopByCategory;
        }

        function removeDuplicateIds(id) {
            const matches = document.querySelectorAll("#" + id);
            for (let i = 1; i < matches.length; i += 1) {
                matches[i].remove();
            }
            return matches[0] || null;
        }

        function isPlacedBeforeHeader(heading, banner, headerContainer) {
            return heading.nextElementSibling === banner && banner.nextElementSibling === headerContainer;
        }

        function layoutIsCorrect(heading, banner, headerContainer) {
            if (!heading || !banner || !heading.parentNode || !banner.parentNode) return false;
            if (!isPlacedBeforeHeader(heading, banner, headerContainer)) return false;

            if (hasCategoryTiles(headerContainer)) {
                const titleContainer = headerContainer.querySelector(CONFIG.titleContainerSelector);
                return Boolean(titleContainer && titleContainer.querySelector("#" + CONFIG.shopByCategoryId));
            }

            return !document.getElementById(CONFIG.shopByCategoryId);
        }

        function ensureCampaignElements() {
            let heading = removeDuplicateIds(CONFIG.headingId);
            let banner = removeDuplicateIds(CONFIG.bannerId);

            rememberMarkup(heading, banner);

            if (!heading) heading = recreateFromMarkup(CONFIG.headingId, headingMarkup);
            if (!banner) banner = recreateFromMarkup(CONFIG.bannerId, bannerMarkup);

            if (!heading || !banner) return null;

            heading.setAttribute(CONFIG.insertedAttr, "true");
            banner.setAttribute(CONFIG.insertedAttr, "true");

            return { heading: heading, banner: banner };
        }

        function placeBeforeHeader(heading, banner, headerContainer) {
            if (isPlacedBeforeHeader(heading, banner, headerContainer)) return;

            const parent = headerContainer.parentNode;
            if (!parent) return;

            parent.insertBefore(heading, headerContainer);
            parent.insertBefore(banner, headerContainer);
        }

        function applyShopByCategory(headerContainer) {
            const titleContainer = headerContainer.querySelector(CONFIG.titleContainerSelector);
            if (!titleContainer || titleContainer.querySelector("#" + CONFIG.shopByCategoryId)) return;

            titleContainer.insertBefore(createShopByCategoryElement(), titleContainer.firstChild);
            headerContainer.classList.add("pb-2", "pb-sm-3", "mb-3", "cont-1656", "hp-margin");
        }

        function applyH1Only() {
            const shopByCategory = document.getElementById(CONFIG.shopByCategoryId);
            if (shopByCategory) shopByCategory.remove();
        }

        function applyDOMChanges() {
            if (isUpdating) return;
            isUpdating = true;

            const observer = window[CONFIG.observerKey];
            if (observer) observer.disconnect();

            try {
                const headerContainer = document.querySelector(CONFIG.headerSelector);
                const existingHeading = document.getElementById(CONFIG.headingId);
                const existingBanner = document.getElementById(CONFIG.bannerId);

                if (headerContainer && layoutIsCorrect(existingHeading, existingBanner, headerContainer)) {
                    removeDuplicateIds(CONFIG.headingId);
                    removeDuplicateIds(CONFIG.bannerId);
                    removeDuplicateIds(CONFIG.shopByCategoryId);
                    return;
                }

                const elements = ensureCampaignElements();
                if (!elements) return;

                if (!headerContainer || !headerContainer.parentNode) {
                    if (document.body && !elements.heading.parentNode) {
                        document.body.appendChild(elements.heading);
                        document.body.appendChild(elements.banner);
                    }
                    return;
                }

                placeBeforeHeader(elements.heading, elements.banner, headerContainer);

                if (hasCategoryTiles(headerContainer)) {
                    applyShopByCategory(headerContainer);
                } else {
                    applyH1Only();
                }
            } finally {
                isUpdating = false;
                if (observer && document.body) {
                    observer.observe(document.body, {
                        childList: true,
                        subtree: true
                    });
                }
            }
        }

        function scheduleDOMChanges() {
            window.clearTimeout(debounceTimer);
            debounceTimer = window.setTimeout(applyDOMChanges, CONFIG.debounceMs);
        }

        function init() {
            applyDOMChanges();

            if (window[CONFIG.observerKey]) {
                window[CONFIG.observerKey].disconnect();
            }

            if (document.body && "MutationObserver" in window) {
                const observer = new MutationObserver(function (records) {
                    if (isUpdating || !mutationsNeedCheck(records)) return;
                    scheduleDOMChanges();
                });
                observer.observe(document.body, {
                    childList: true,
                    subtree: true
                });
                window[CONFIG.observerKey] = observer;
            }
        }

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", init, { once: true });
        } else {
            init();
        }
    })();
</script>
